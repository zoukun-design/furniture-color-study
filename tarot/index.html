<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarot — 78枚の図鑑</title>
<meta name="description" content="タロットカード78枚を、絵とことばで学ぶ図鑑。ライダー版（1909）。">
<meta name="theme-color" content="#F3F0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tarot">
<meta property="og:title" content="Tarot — 78枚の図鑑">
<meta property="og:description" content="タロットカード78枚を、絵とことばで学ぶ図鑑。">
<meta property="og:image" content="og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0EA; --surface:#FBFAF7; --sunk:#E9E5DC; --ink:#191816; --ink2:#4A4740; --muted:#7C776E;
  --line:rgba(25,24,22,.13); --dim:rgba(18,17,16,.42); --on-ink:#F3F0EA;
  --serif:"Instrument Serif", "Shippori Mincho", serif; --mincho:"Shippori Mincho", serif;
  --sans:"Zen Kaku Gothic New", system-ui, sans-serif;
  --ease:cubic-bezier(.2,0,0,1); --t:280ms;
  --gut:16px; --navh:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121110; --surface:#1B1A18; --sunk:#25231F; --ink:#EDEAE3; --ink2:#C9C5BC; --muted:#958F85;
  --line:rgba(237,234,227,.14); --dim:rgba(0,0,0,.55); --on-ink:#121110;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.75 var(--sans);letter-spacing:.02em;
  min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
p{text-wrap:pretty}
.blk>p,.mean,.scene,.res p{text-wrap:balance}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top ---------- */
.top{padding:calc(var(--sat) + 22px) var(--gut) 6px;text-align:center}
.brand{margin:0;font:400 44px/1 var(--serif);letter-spacing:-.01em}
.brand i{font-style:italic}
.tag{margin:8px 0 0;font-size:12px;color:var(--muted);letter-spacing:.14em}
.tabs-top{display:none}

/* ---------- views ---------- */
main{max-width:1180px;margin:0 auto;padding:0 var(--gut) calc(var(--navh) + var(--sab) + 28px)}
.view{display:none;animation:fade var(--t) var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* search + chips */
.tools{position:sticky;top:0;z-index:5;margin:0 calc(-1*var(--gut));padding:12px var(--gut) 10px;background:var(--bg);
  transition:box-shadow var(--t) var(--ease)}
.tools.stuck{box-shadow:0 1px 0 var(--line)}
.search{position:relative;max-width:560px;margin:0 auto}
.search input{width:100%;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:16px;padding:0 48px;outline:none;text-align:center;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;left:16px;top:13px;color:var(--muted)}
.search .clr{position:absolute;right:0;top:0;width:48px;height:48px;display:none;place-items:center;color:var(--muted)}
.search.has .clr{display:grid}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px calc(-1*var(--gut)) 0;padding:0 var(--gut);
  justify-content:safe center;scroll-padding:0 var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);font-size:13px;letter-spacing:.06em;
  white-space:nowrap;position:relative;transition:background var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease)}
.chip::after{content:"";position:absolute;inset:-6px -2px}  /* 48px touch target */
.chip[aria-pressed=true]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* grid */
.sec{margin-top:26px;text-align:center}
.sec h2{margin:0;font:400 30px/1.1 var(--serif)}
.sec h2 i{font-style:italic}
.sec p{margin:6px 0 0;font-size:12px;color:var(--muted);letter-spacing:.1em}
.count{margin:22px 0 0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.12em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin-top:16px}
.tile{display:block;text-align:center;border-radius:10px;min-width:0}
.tile .im{aspect-ratio:284/500;border-radius:8px;overflow:hidden;background:var(--sunk);
  transition:transform var(--t) var(--ease)}
.tile .im img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 400ms var(--ease)}
.tile .im img.ok{opacity:1}
.tile:active .im{transform:scale(.97)}
.tile .no{display:block;margin-top:8px;font:400 13px/1 var(--serif);color:var(--muted);letter-spacing:.06em}
.tile .nm{display:block;margin-top:4px;font:500 12.5px/1.3 var(--sans);white-space:nowrap;letter-spacing:.02em}
.empty{padding:64px 0;text-align:center;color:var(--muted);font-size:14px}
@media (hover:hover){.tile:hover .im{transform:translateY(-3px)}}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.nav button{flex:1;max-width:160px;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:11px;letter-spacing:.1em;transition:color var(--t) var(--ease)}
.nav button[aria-current=page]{color:var(--ink)}
.nav .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background var(--t) var(--ease)}
.nav button[aria-current=page] .pill{background:var(--sunk)}

/* ---------- learn ---------- */
.art{max-width:640px;margin:0 auto}
.blk{margin-top:34px;text-align:center}
.blk:first-child{margin-top:18px}
.kick{font:400 13px/1 var(--serif);color:var(--muted);letter-spacing:.12em}
.blk h3{margin:10px 0 0;font:600 22px/1.4 var(--mincho);letter-spacing:.04em}
.blk>p{margin:12px auto 0;color:var(--ink2);max-width:34em}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 12px}
.box b{display:block;font:400 44px/1 var(--serif)}
.box span{display:block;margin-top:8px;font-size:13px;letter-spacing:.06em}
.box small{display:block;margin-top:2px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px calc(-1*var(--gut)) 0;padding:0 var(--gut) 4px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:none;width:76px;scroll-snap-align:center}
.strip .tile .nm{font-size:11px}
.suits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.suit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 16px;text-align:center}
.suit img{width:56px;margin:0 auto;border-radius:5px}
.suit h4{margin:10px 0 0;font:400 22px/1 var(--serif)}
.suit .ja{margin-top:6px;font-size:13px;letter-spacing:.06em}
.suit .el{display:inline-block;margin-top:8px;font-size:11px;padding:2px 10px;border-radius:10px;background:var(--sunk);letter-spacing:.1em}
.suit .th{margin-top:8px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.list{margin:18px 0 0;padding:0;list-style:none;border-top:1px solid var(--line);text-align:left}
.list li{display:grid;grid-template-columns:56px 1fr;align-items:baseline;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line)}
.list li b{font:400 24px/1 var(--serif);text-align:center}
.list li span{font-size:14px;color:var(--ink2)}
.list li span em{font-style:normal;color:var(--ink);font-weight:500;margin-right:.5em}
.steps{counter-reset:st;margin:18px 0 0;padding:0;list-style:none;text-align:left}
.steps li{counter-increment:st;position:relative;padding:14px 4px 14px 52px;border-bottom:1px solid var(--line)}
.steps li:first-child{border-top:1px solid var(--line)}
.steps li::before{content:counter(st);position:absolute;left:8px;top:12px;font:400 28px/1 var(--serif)}
.steps li b{display:block;font-weight:500}
.steps li span{font-size:14px;color:var(--ink2)}
.credit{margin:44px auto 0;font-size:11px;color:var(--muted);text-align:center;max-width:32em;line-height:1.8}

/* ---------- today ---------- */
.today{max-width:520px;margin:0 auto;text-align:center;padding-top:14px}
.date{font:400 15px/1 var(--serif);color:var(--muted);letter-spacing:.12em}
.today h3{margin:10px 0 0;font:600 20px/1.4 var(--mincho);letter-spacing:.06em}
.flipper{width:min(58vw,250px);aspect-ratio:284/500;margin:22px auto 0;perspective:1400px;display:block}
.flipper .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 900ms var(--ease)}
.flipper.open .in{transform:rotateY(180deg)}
.flipper .f,.flipper .b{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipper .f{transform:rotateY(180deg)}
.flipper .f img{width:100%;height:100%;object-fit:cover;transition:transform 0ms}
.flipper .f img.rev{transform:rotate(180deg)}
.back{background:#1E1C2A;display:grid;place-items:center}
.back svg{width:100%;height:100%}
.hint{margin-top:16px;font-size:12px;color:var(--muted);letter-spacing:.12em;transition:opacity var(--t) var(--ease)}
.res{opacity:0;transform:translateY(8px);transition:opacity 500ms var(--ease) 300ms,transform 500ms var(--ease) 300ms;pointer-events:none}
.res.on{opacity:1;transform:none;pointer-events:auto}
.res .o{margin-top:18px;font-size:12px;letter-spacing:.16em;color:var(--muted)}
.res .n{margin:4px 0 0;font:600 26px/1.3 var(--mincho)}
.res .e{font:italic 400 17px/1.2 var(--serif);color:var(--muted)}
.res p{margin:12px auto 0;color:var(--ink2);max-width:28em}
.btns{display:flex;gap:10px;justify-content:center;margin-top:20px}
.btn{height:48px;padding:0 22px;border-radius:24px;border:1px solid var(--line);font-size:14px;letter-spacing:.06em;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* ---------- detail sheet ---------- */
.dim{position:fixed;inset:0;z-index:40;background:var(--dim);opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease)}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;z-index:41;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);visibility:hidden;transition:transform var(--t) var(--ease),visibility 0s linear var(--t)}
.sheet.on{transform:none;visibility:visible;transition:transform var(--t) var(--ease),visibility 0s}
.bar{flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;padding:var(--sat) 4px 0;box-sizing:content-box;
  border-bottom:1px solid transparent;transition:border-color var(--t) var(--ease)}
.bar.line{border-color:var(--line)}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px}
.ib:active{background:var(--sunk)}
.bar .t{text-align:center;font:400 15px/1 var(--serif);letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.ib .on-fill{fill:currentColor}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dwrap{max-width:980px;margin:0 auto;padding:14px var(--gut) calc(var(--sab) + 32px)}
.dcard{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dimg{width:min(58vw,280px);aspect-ratio:284/500;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--sunk);
  transition:transform 520ms var(--ease)}
.dimg.rev{transform:rotate(180deg)}
.dimg img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.dmove{transition:transform var(--t) var(--ease),opacity var(--t) var(--ease)}
.seg{display:flex;width:fit-content;margin:18px auto 0;padding:3px;border-radius:24px;background:var(--sunk)}
.seg button{height:42px;min-width:104px;padding:0 18px;border-radius:21px;font-size:13px;letter-spacing:.1em;color:var(--muted);
  transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.dtext{text-align:center}
.dno{margin-top:24px;font:400 15px/1 var(--serif);color:var(--muted);letter-spacing:.14em}
.dja{margin:8px 0 0;font:600 30px/1.3 var(--mincho);letter-spacing:.04em}
.den{font:italic 400 20px/1.2 var(--serif);color:var(--muted)}
.kws{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:18px auto 0;max-width:30em}
.kw{height:30px;padding:0 13px;border-radius:15px;border:1px solid var(--line);font-size:12.5px;line-height:28px;letter-spacing:.06em;white-space:nowrap}
.mean{margin:14px auto 0;max-width:30em;color:var(--ink2);font-size:15.5px}
.h{margin:34px 0 0;font:400 13px/1 var(--serif);color:var(--muted);letter-spacing:.16em}
.h+.hr{margin:12px auto 0;width:24px;border-top:1px solid var(--ink)}
.scene{margin:14px auto 0;max-width:30em;color:var(--ink2)}
.syms{margin:16px auto 0;padding:0;list-style:none;max-width:30em;border-top:1px solid var(--line);text-align:left}
.syms li{display:grid;grid-template-columns:42% 1fr;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}
.syms li b{font-weight:500}
.syms li span{color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:16px auto 0;max-width:30em;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{padding:12px 4px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts small{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em}
.facts span{display:block;margin-top:4px;font-size:13px;white-space:nowrap}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:34px auto 0;max-width:30em}
.pn button{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;text-align:left;min-width:0}
.pn button.nx{flex-direction:row-reverse;text-align:right}
.pn img{width:36px;border-radius:4px;flex:none}
.pn small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.12em}
.pn span{display:block;font-size:12.5px;white-space:nowrap}

/* ---------- tablet portrait ---------- */
@media (min-width:600px){
  :root{--gut:28px}
  .grid{grid-template-columns:repeat(4,1fr);gap:24px 14px}
  .brand{font-size:54px}
  .split .box b{font-size:52px}
  .suits{grid-template-columns:repeat(4,1fr)}
}
/* ---------- wide: PC, iPad landscape ---------- */
@media (min-width:900px){
  :root{--navh:0px}
  .nav{display:none}
  .top{padding-top:calc(var(--sat) + 34px)}
  .tabs-top{display:flex;justify-content:center;gap:6px;margin-top:20px}
  .tabs-top button{height:40px;padding:0 18px;border-radius:20px;font-size:13px;letter-spacing:.12em;color:var(--muted);
    transition:background var(--t) var(--ease),color var(--t) var(--ease)}
  .tabs-top button[aria-current=page]{background:var(--sunk);color:var(--ink)}
  @media (hover:hover){.tabs-top button:hover{color:var(--ink)}}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:28px 18px}
  .sheet{inset:auto;left:50%;top:50%;width:min(980px,calc(100vw - 64px));height:min(760px,calc(100dvh - 64px));border-radius:24px;
    transform:translate(-50%,-46%);opacity:0;transition:transform var(--t) var(--ease),opacity var(--t) var(--ease),visibility 0s linear var(--t)}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;transition:transform var(--t) var(--ease),opacity var(--t) var(--ease),visibility 0s}
  .bar{padding-top:0}
  .dwrap{display:grid;grid-template-columns:340px 1fr;gap:48px;align-items:start;padding:18px 48px 40px}
  .dcard{position:sticky;top:18px}
  .dimg{width:100%}
  .dtext{text-align:left}
  .dno{margin-top:6px}
  .kws{justify-content:flex-start;margin-left:0}
  .mean,.scene,.syms,.facts,.pn{margin-left:0}
  .h+.hr{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">Tarot <i>Atlas</i></h1>
  <p class="tag">78枚のタロット図鑑</p>
  <nav class="tabs-top" aria-label="メイン">
    <button data-tab="cards">図鑑</button><button data-tab="learn">はじめに</button><button data-tab="today">今日の1枚</button>
  </nav>
</header>

<main>
  <section class="view" id="v-cards" aria-label="図鑑">
    <div class="tools" id="tools">
      <div class="search" id="search">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="名前・キーワードで探す" autocomplete="off" enterkeyhint="search" aria-label="カードを検索">
        <button class="clr" id="qclr" aria-label="検索をクリア"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="分類で絞り込む"></div>
    </div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-learn" aria-label="はじめに"><div class="art" id="learn"></div></section>

  <section class="view" id="v-today" aria-label="今日の1枚"><div class="today" id="today"></div></section>
</main>

<nav class="nav" aria-label="メイン">
  <button data-tab="cards"><span class="pill"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></span>図鑑</button>
  <button data-tab="learn"><span class="pill"><svg class="ico" viewBox="0 0 24 24"><path d="M12 6.5C10.3 5.2 7.9 4.5 4 4.5v14c3.9 0 6.3.7 8 2 1.7-1.3 4.1-2 8-2v-14c-3.9 0-6.3.7-8 2z"/><path d="M12 6.5v14"/></svg></span>はじめに</button>
  <button data-tab="today"><span class="pill"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5l1.9 6.6 6.6 1.9-6.6 1.9-1.9 6.6-1.9-6.6-6.6-1.9 6.6-1.9z"/></svg></span>今日の1枚</button>
</nav>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dja">
  <div class="bar" id="bar">
    <button class="ib" id="dclose" aria-label="閉じる"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t" id="dtop"></div>
    <button class="ib" id="dsave" aria-label="保存" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><path d="M6.5 4.5h11v15.5L12 16.2 6.5 20z"/></svg></button>
  </div>
  <div class="scroll" id="dscroll">
    <div class="dwrap">
      <div class="dcard" id="dcard">
        <div class="dmove" id="dmove"><div class="dimg" id="dimg"><img id="dpic" alt="" width="284" height="500"></div></div>
        <div class="seg" role="group" aria-label="向き">
          <button id="sup" aria-pressed="true">正位置</button><button id="srv" aria-pressed="false">逆位置</button>
        </div>
      </div>
      <div class="dtext dmove" id="dtext"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
(() => {
const {cards: CARDS, SUITS} = window.TAROT;
const $ = s => document.querySelector(s);
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
const GROUPS = [
  {k: "all", label: "すべて"},
  {k: "m", label: "大アルカナ", en: "Major <i>Arcana</i>", sub: "大アルカナ・22枚・人生の大きなテーマ"},
  ...["w", "c", "s", "p"].map(k => ({k, label: SUITS[k].ja, en: SUITS[k].en, sub: `${SUITS[k].ja}（${SUITS[k].sub}）・${SUITS[k].el}・${SUITS[k].theme}`})),
  {k: "saved", label: "保存"}
];
const store = {
  get(k, d) { try { const v = localStorage.getItem("tarot." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tarot." + k, JSON.stringify(v)); } catch (e) {} }
};
let saved = new Set(store.get("saved", []));
let filter = "all", query = "";
let visible = CARDS.slice();

const img = c => `cards/${c.id}.webp`;
const label = c => c.group === "m" ? (c.num === 0 ? "0" : c.roman) : c.roman;
const groupName = c => c.group === "m" ? "大アルカナ" : SUITS[c.group].ja;
const tile = c => `<a class="tile" href="?c=${c.id}" data-id="${c.id}"><div class="im"><img src="${img(c)}" alt="${c.ja}" width="284" height="500" loading="lazy" decoding="async" onload="this.classList.add('ok')"></div><span class="no">${label(c)}</span><span class="nm">${c.ja}</span></a>`;

/* ---------- tabs ---------- */
const TABS = ["cards", "learn", "today"];
function setTab(t, push) {
  if (!TABS.includes(t)) t = "cards";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + t));
  document.querySelectorAll("[data-tab]").forEach(b => b.dataset.tab === t ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (push !== false) history.replaceState(history.state, "", t === "cards" ? location.pathname : "#" + t);
  window.scrollTo(0, 0);
  if (t === "cards") fitNames();
}
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

/* ---------- catalogue ---------- */
const chipsEl = $("#chips");
chipsEl.innerHTML = GROUPS.map(g => `<button class="chip" data-k="${g.k}" aria-pressed="${g.k === filter}">${g.label}</button>`).join("");
chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.k;
  chipsEl.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  b.scrollIntoView({inline: "nearest", block: "nearest", behavior: "smooth"});
  renderList();
  const t = $("#tools"); if (t.getBoundingClientRect().top <= 0) window.scrollTo({top: t.offsetTop, behavior: "smooth"});
});
const norm = s => s.toLowerCase().normalize("NFKC").replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
function match(c, q) {
  const hay = norm([c.ja, c.en, c.roman, ...c.kw, ...c.rk, c.astro || "", c.group === "m" ? "大アルカナ" : SUITS[c.group].sub + SUITS[c.group].el].join(" "));
  return q.split(/\s+/).every(w => hay.includes(w));
}
function renderList() {
  const q = norm(query.trim());
  let list = CARDS.filter(c => filter === "all" || filter === "saved" ? true : c.group === filter);
  if (filter === "saved") list = list.filter(c => saved.has(c.id));
  if (q) list = list.filter(c => match(c, q));
  visible = list;
  let h = "";
  if (!list.length) {
    h = `<p class="empty">${filter === "saved" && !q ? "保存したカードはまだありません。<br>カードを開いて右上のしおりで保存できます。" : "見つかりませんでした。"}</p>`;
  } else if (!q && filter !== "saved") {
    for (const g of GROUPS.filter(g => g.en && (filter === "all" || g.k === filter))) {
      h += `<div class="sec"><h2>${g.en}</h2><p>${g.sub}</p></div><div class="grid">${list.filter(c => c.group === g.k).map(tile).join("")}</div>`;
    }
  } else {
    h = `<p class="count">${list.length}枚</p><div class="grid">${list.map(tile).join("")}</div>`;
  }
  $("#list").innerHTML = h;
  fitNames();
}
// one-line names: shrink only the few that do not fit their column
function fitNames(root) {
  requestAnimationFrame(() => (root || document).querySelectorAll(".tile .nm").forEach(n => {
    n.style.fontSize = "";
    const w = n.clientWidth, s = n.scrollWidth;
    if (w && s > w) n.style.fontSize = Math.max(9, parseFloat(getComputedStyle(n).fontSize) * w / s - .2) + "px";
  }));
}
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => fitNames(), 120); });
const qEl = $("#q");
qEl.addEventListener("input", () => { query = qEl.value; $("#search").classList.toggle("has", !!query); renderList(); });
$("#qclr").addEventListener("click", () => { qEl.value = ""; query = ""; $("#search").classList.remove("has"); renderList(); qEl.focus(); });
qEl.addEventListener("keydown", e => { if (e.key === "Enter") qEl.blur(); });
document.addEventListener("click", e => {
  const a = e.target.closest("a.tile"); if (!a) return;
  e.preventDefault();
  const inList = a.closest("#list");
  openCard(a.dataset.id, inList ? visible : CARDS);
});
const toolsEl = $("#tools");
new IntersectionObserver(([en]) => toolsEl.classList.toggle("stuck", en.intersectionRatio < 1), {threshold: [1], rootMargin: "-1px 0px 0px 0px"}).observe(toolsEl);

/* ---------- detail ---------- */
const sheet = $("#sheet"), dim = $("#dim");
let cur = null, nav = CARDS, rev = false, opener = null, isOpen = false;
function fill(c) {
  cur = c;
  const i = nav.indexOf(c), prev = nav[(i - 1 + nav.length) % nav.length], next = nav[(i + 1) % nav.length];
  $("#dpic").src = img(c); $("#dpic").alt = c.ja + "（" + c.en + "）";
  $("#dtop").textContent = `${label(c)} · ${groupName(c)}`;
  const s = c.group === "m" ? null : SUITS[c.group];
  const facts = c.group === "m"
    ? [["分類", "大アルカナ"], ["番号", c.num], ["対応", c.astro]]
    : [["スート", `${s.ja}（${s.sub}）`], ["元素", s.el], ["対応", c.astro || (c.num === 1 ? "元素の源" : "人物カード")]];
  $("#dtext").innerHTML = `
    <div class="dno">${c.group === "m" ? "No. " + label(c) : s.en.toUpperCase() + " · " + label(c)}</div>
    <h2 class="dja" id="dja">${c.ja}</h2>
    <div class="den">${c.en}</div>
    <div class="kws" id="dkw"></div>
    <p class="mean" id="dmean"></p>
    <div class="h">THE PICTURE</div><div class="hr"></div>
    <p class="scene">${c.scene}</p>
    ${c.sym ? `<ul class="syms">${c.sym.map(([a, b]) => `<li><b>${a}</b><span>${b}</span></li>`).join("")}</ul>` : ""}
    <div class="h">DETAILS</div><div class="hr"></div>
    <div class="facts">${facts.map(([a, b]) => `<div><small>${a}</small><span>${b}</span></div>`).join("")}</div>
    ${s ? `<p class="scene">${s.ja}は「${s.theme}」を表すスート。${c.num <= 10 ? NUM[c.num] : COURT[c.num]}</p>` : ""}
    <div class="pn">
      <button data-d="-1" aria-label="前のカード ${prev.ja}"><img src="${img(prev)}" alt=""><div><small>PREV</small><span>${prev.ja}</span></div></button>
      <button class="nx" data-d="1" aria-label="次のカード ${next.ja}"><img src="${img(next)}" alt=""><div><small>NEXT</small><span>${next.ja}</span></div></button>
    </div>`;
  setRev(rev, true);
  const sv = saved.has(c.id);
  $("#dsave").setAttribute("aria-pressed", sv);
  $("#dsave").setAttribute("aria-label", sv ? "保存を解除" : "保存");
  $("#dsave path").classList.toggle("on-fill", sv);
  requestAnimationFrame(() => fitOne($("#dtext")));
}
function fitOne(root) {
  root.querySelectorAll(".pn span").forEach(n => {
    n.style.fontSize = ""; const w = n.clientWidth, s = n.scrollWidth;
    if (w && s > w) n.style.fontSize = Math.max(9, 12.5 * w / s - .2) + "px";
  });
}
function setRev(r, quiet) {
  rev = r;
  $("#dimg").classList.toggle("rev", r);
  $("#sup").setAttribute("aria-pressed", !r); $("#srv").setAttribute("aria-pressed", r);
  if (!cur) return;
  const kw = r ? cur.rk : cur.kw;
  $("#dkw").innerHTML = kw.map(k => `<span class="kw">${k}</span>`).join("");
  $("#dmean").textContent = r ? cur.rv : cur.up;
}
function openCard(id, list, reversed) {
  const c = byId[id]; if (!c) return;
  nav = list && list.includes(c) ? list : CARDS;
  rev = !!reversed;
  fill(c);
  $("#dscroll").scrollTop = 0;
  if (!isOpen) {
    opener = document.activeElement;
    isOpen = true;
    document.documentElement.classList.add("lock");
    sheet.classList.add("on"); dim.classList.add("on");
    history.pushState({card: id}, "", "?c=" + id + location.hash);
    setTimeout(() => $("#dclose").focus({preventScroll: true}), 30);
  } else history.replaceState({card: id}, "", "?c=" + id + location.hash);
}
function closeSheet(fromPop) {
  if (!isOpen) return;
  if (!fromPop) { history.back(); return; }
  isOpen = false;
  sheet.classList.remove("on"); dim.classList.remove("on");
  document.documentElement.classList.remove("lock");
  if (opener && opener.focus) opener.focus({preventScroll: true});
}
addEventListener("popstate", e => {
  if (e.state && e.state.card) openCard(e.state.card, nav); else closeSheet(true);
});
$("#dclose").addEventListener("click", () => closeSheet());
dim.addEventListener("click", () => closeSheet());
$("#sup").addEventListener("click", () => setRev(false));
$("#srv").addEventListener("click", () => setRev(true));
$("#dsave").addEventListener("click", () => {
  saved.has(cur.id) ? saved.delete(cur.id) : saved.add(cur.id);
  store.set("saved", [...saved]);
  fill(cur);
  if (filter === "saved") renderList();
});
$("#dtext").addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (b) go(+b.dataset.d); });
$("#dscroll").addEventListener("scroll", e => $("#bar").classList.toggle("line", e.target.scrollTop > 4), {passive: true});
let going = false;
function go(d) {
  if (going) return; going = true;
  const i = nav.indexOf(cur), n = nav[(i + d + nav.length) % nav.length];
  const els = [$("#dmove"), $("#dtext")];
  els.forEach(el => { el.style.opacity = 0; el.style.transform = `translateX(${-d * 28}px)`; });
  setTimeout(() => {
    rev = false; fill(n);
    history.replaceState({card: n.id}, "", "?c=" + n.id + location.hash);
    els.forEach(el => { el.style.transition = "none"; el.style.transform = `translateX(${d * 28}px)`; });
    $("#dscroll").scrollTo({top: 0});
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els.forEach(el => { el.style.transition = ""; el.style.opacity = 1; el.style.transform = ""; });
      going = false;
    }));
  }, 200);
}
// tap the card to turn it, swipe to move on
(() => {
  const el = $("#dcard"); let x0 = 0, y0 = 0, dx = 0, on = false, horiz = null;
  el.addEventListener("pointerdown", e => { if (e.target.closest(".seg")) return; on = true; x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = null; });
  el.addEventListener("pointermove", e => {
    if (!on) return; dx = e.clientX - x0; const dy = e.clientY - y0;
    if (horiz === null && Math.hypot(dx, dy) > 8) horiz = Math.abs(dx) > Math.abs(dy);
    if (horiz) { const m = $("#dmove"); m.style.transition = "none"; m.style.transform = `translateX(${dx * .5}px)`; }
  });
  const end = e => {
    if (!on) return; on = false;
    const m = $("#dmove"); m.style.transition = "";
    if (horiz && Math.abs(dx) > 56) go(dx < 0 ? 1 : -1);
    else { m.style.transform = ""; if (horiz === null && e.type === "pointerup" && e.target.closest("#dimg")) setRev(!rev); }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
})();
addEventListener("keydown", e => {
  if (!isOpen) return;
  if (e.key === "Escape") closeSheet();
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Tab") { // keep focus inside the dialog
    const f = [...sheet.querySelectorAll("button")].filter(b => b.offsetParent);
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

/* ---------- learn ---------- */
const NUM = ["", "エースは、そのスートの力が生まれる「種」。", "2は「選択・均衡」の段階。", "3は「成長・広がり」の段階。", "4は「安定・土台」の段階。", "5は「葛藤・揺らぎ」の段階。",
  "6は「調和・回復」の段階。", "7は「試練・見きわめ」の段階。", "8は「動き・積み重ね」の段階。", "9は「到達目前」の段階。", "10は「完結と次への移行」の段階。"];
const COURT = {11: "ペイジは「学ぶ人・知らせ」。", 12: "ナイトは「行動する人」。", 13: "クイーンは「内面で受け止め育てる人」。", 14: "キングは「外へ向けて統率する人」。"};
const majors = CARDS.filter(c => c.group === "m");
$("#learn").innerHTML = `
  <div class="blk"><div class="kick">01 — STRUCTURE</div><h3>タロットは78枚</h3>
    <p>タロットは「大アルカナ」22枚と「小アルカナ」56枚でできています。大アルカナは人生の大きなテーマ、小アルカナは日々の具体的な出来事を表します。</p>
    <div class="split"><div class="box"><b>22</b><span>大アルカナ</span><small>Major Arcana</small></div><div class="box"><b>56</b><span>小アルカナ</span><small>Minor Arcana</small></div></div></div>
  <div class="blk"><div class="kick">02 — THE FOOL'S JOURNEY</div><h3>愚者の旅</h3>
    <p>大アルカナは0番の「愚者」が出会いと試練を重ね、21番の「世界」で旅を完成させる物語として読むことができます。順番に眺めると、一枚ずつの意味がつながって見えてきます。</p>
    <div class="strip">${majors.map(tile).join("")}</div></div>
  <div class="blk"><div class="kick">03 — FOUR SUITS</div><h3>小アルカナの4つのスート</h3>
    <p>小アルカナはトランプと同じく4つのマークに分かれ、それぞれ自然の四元素に対応しています。各スートはエース〜10の数札10枚と、4人の人物カードの計14枚です。</p>
    <div class="suits">${["w", "c", "s", "p"].map(k => `<div class="suit"><img src="cards/${k}01.webp" alt="${SUITS[k].ja}のエース" width="284" height="500" loading="lazy"><h4>${SUITS[k].en}</h4><div class="ja">${SUITS[k].ja}（${SUITS[k].sub}）</div><span class="el">${SUITS[k].el}</span><div class="th">${SUITS[k].theme}</div></div>`).join("")}</div></div>
  <div class="blk"><div class="kick">04 — NUMBERS</div><h3>数が表す段階</h3>
    <p>数札は、エースから10へと物事が育っていく流れになっています。スートの意味に数の段階を重ねると、カードの意味が自然に読めます。</p>
    <ul class="list">${[["A", "はじまり", "種・純粋な力"], ["2", "選択", "ふたつのあいだの均衡"], ["3", "成長", "最初のかたち"], ["4", "安定", "土台ができる"], ["5", "葛藤", "安定がゆらぐ"], ["6", "調和", "回復と分かち合い"], ["7", "試練", "立ち止まって見きわめる"], ["8", "動き", "積み重ね・変化"], ["9", "到達目前", "ひとりで得たもの"], ["10", "完結", "終わりと次への移行"]].map(([a, b, c]) => `<li><b>${a}</b><span><em>${b}</em>${c}</span></li>`).join("")}</ul></div>
  <div class="blk"><div class="kick">05 — COURT CARDS</div><h3>4人の人物カード</h3>
    <p>人物カードは、実在の人物や、自分の中にある性質を表します。若い順に、学ぶ人から導く人へと成熟していきます。</p>
    <ul class="list">${[["P", "ペイジ", "学ぶ人・新しい知らせ"], ["Kn", "ナイト", "行動する人・物事の進展"], ["Q", "クイーン", "受け止め、内側で育てる人"], ["K", "キング", "経験をもとに外へ導く人"]].map(([a, b, c]) => `<li><b>${a}</b><span><em>${b}</em>${c}</span></li>`).join("")}</ul></div>
  <div class="blk"><div class="kick">06 — UPRIGHT &amp; REVERSED</div><h3>正位置と逆位置</h3>
    <p>カードが上下逆さまに出たときを「逆位置」と呼びます。意味が反対になるというより、そのカードの力が「弱まる・滞る・行きすぎる・内側に向く」と考えると読みやすくなります。図鑑ではカードをタップすると向きを変えられます。</p></div>
  <div class="blk"><div class="kick">07 — HOW TO READ</div><h3>1枚の読み方</h3>
    <ol class="steps">
      <li><b>まず絵を見る</b><span>人物は何をしているか、どちらを向いているか、表情や天気はどうか。</span></li>
      <li><b>色と記号に気づく</b><span>黄色は意識や明るさ、青は感情や直感、赤は情熱。繰り返し出てくる記号にも意味があります。</span></li>
      <li><b>キーワードとつなぐ</b><span>絵から受けた印象と、キーワードや数・スートの意味を重ねて、自分の言葉にします。</span></li>
    </ol></div>
  <p class="credit">カードの絵：ライダー・ウェイト・スミス版（1909年、パメラ・コールマン・スミス画、A. E. ウェイト監修）。パブリックドメイン。<br>解説文はこの図鑑のために書いたものです。</p>`;

/* ---------- today ---------- */
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const d = new Date(), key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const W = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
let pick = CARDS[hash(key) % 78], pickRev = hash(key + "r") % 4 === 0;
const back = `<svg viewBox="0 0 284 500" aria-hidden="true"><g fill="none" stroke="#D9C9A0" stroke-width="1.2"><rect x="14" y="14" width="256" height="472" rx="6"/><rect x="22" y="22" width="240" height="456" rx="3" opacity=".5"/><circle cx="142" cy="250" r="64"/><circle cx="142" cy="250" r="44" opacity=".6"/><path d="M142 150 L155 237 L242 250 L155 263 L142 350 L129 263 L42 250 L129 237Z"/><path d="M142 196 L152 240 L196 250 L152 260 L142 304 L132 260 L88 250 L132 240Z" opacity=".6"/><path d="M142 46v40M142 414v40" opacity=".6"/><circle cx="142" cy="40" r="3"/><circle cx="142" cy="460" r="3"/></g></svg>`;
function renderToday(fresh) {
  const c = pick;
  $("#today").innerHTML = `
    <div class="date">${W[d.getDay()]} · ${d.getMonth() + 1}.${d.getDate()}</div>
    <h3>${fresh ? "もう1枚" : "今日の1枚"}</h3>
    <button class="flipper" id="flip" aria-label="カードをめくる"><div class="in"><div class="b back">${back}</div><div class="f"><img src="${img(c)}" alt="${c.ja}" class="${pickRev ? "rev" : ""}"></div></div></button>
    <div class="hint" id="fhint">タップしてめくる</div>
    <div class="res" id="fres">
      <div class="o">${pickRev ? "逆位置" : "正位置"}</div>
      <div class="n">${c.ja}</div><div class="e">${c.en}</div>
      <p>${pickRev ? c.rv : c.up}</p>
      <div class="btns"><button class="btn pri" id="fmore">くわしく見る</button><button class="btn" id="fagain">もう1枚</button></div>
    </div>`;
  const f = $("#flip");
  f.addEventListener("click", () => {
    if (f.classList.contains("open")) { openCard(c.id, CARDS, pickRev); return; }
    f.classList.add("open"); f.setAttribute("aria-label", c.ja + "をくわしく見る");
    $("#fhint").style.opacity = 0; $("#fres").classList.add("on");
  });
  $("#fmore").addEventListener("click", () => openCard(c.id, CARDS, pickRev));
  $("#fagain").addEventListener("click", () => {
    let n; do n = CARDS[Math.floor(Math.random() * 78)]; while (n === pick);
    pick = n; pickRev = Math.random() < .25; renderToday(true);
  });
}
renderToday();

/* ---------- start ---------- */
renderList();
setTab((location.hash || "").slice(1), false);
const startId = new URLSearchParams(location.search).get("c");
if (byId[startId]) {
  history.replaceState(null, "", location.pathname + location.hash);
  openCard(startId, CARDS);
}
})();
</script>
</body>
</html>
