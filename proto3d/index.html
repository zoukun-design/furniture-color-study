<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desk Study 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--mute:#5c5c5c;--line:#e4e3df;--bg:#ffffff;--chip:#f3f2ef;--red:#e0301e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#141414;--mute:#5c5c5c;--line:#e4e3df;--bg:#ffffff;--chip:#f3f2ef}}
:root[data-theme="dark"]{--ink:#141414;--mute:#5c5c5c;--line:#e4e3df;--bg:#ffffff;--chip:#f3f2ef}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'BIZ UDPGothic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100svh}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;justify-content:space-between;height:44px}
.logo{font-family:'Barlow',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.dot{display:inline-block;width:.242em;height:.242em;background:var(--red);margin-left:.0605em;position:relative;top:.5px}
.tag{font-family:'Barlow',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--mute);border:1px solid var(--line);border-radius:999px;height:24px;display:flex;align-items:center;padding:0 10px;white-space:nowrap}
.info{margin-top:6px;border-top:1px solid var(--line)}
.ttl{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);height:38px;align-items:center;padding:0 2px}
.ttl small{font-size:11px;letter-spacing:.08em;color:var(--mute);font-family:'Barlow',sans-serif;font-weight:500}
.ttl b{font-family:'Barlow',sans-serif;font-weight:500;font-size:17px;white-space:nowrap}
.stage{position:relative;width:100%;aspect-ratio:1/1.04;margin-top:12px;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.envb{position:absolute;top:6px;left:0;z-index:3;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--chip);color:var(--ink);font-family:Barlow,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.envb .lv{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;margin-right:2px;transition:color .3s ease}
.envb .lv i{width:8px;height:8px;background:var(--red);display:block;flex:none;position:relative;top:-1px;transition:background .3s ease}
.envb.off .lv{color:#a19d94}.envb.off .lv i{background:#c9c5bc}
.envb .tx{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.envb svg{display:block;flex:none}
.rst{position:absolute;top:6px;right:0;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .35s ease;-webkit-tap-highlight-color:transparent}
.rst.on{opacity:1;pointer-events:auto}
.hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-family:Barlow,sans-serif;font-weight:500;font-size:12px;letter-spacing:.02em;color:var(--mute);background:rgba(243,242,239,.92);height:26px;border-radius:13px;padding:0 12px;display:flex;align-items:center;white-space:nowrap;opacity:0;transition:opacity .5s ease;pointer-events:none}
.hint.on{opacity:1}
.time{margin:10px 0 4px;padding:0 2px}
.trk{position:relative;height:30px}
.trk input{appearance:none;-webkit-appearance:none;width:100%;height:30px;margin:0;background:transparent;cursor:pointer;position:relative;z-index:1}
.trk input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.trk input::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
.trk input::-moz-range-track{height:1px;background:var(--ink)}
.trk input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--ink);margin-top:-9px}
.trk input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid var(--ink)}
.tks{display:flex;justify-content:space-between;font-family:Barlow,sans-serif;font-weight:500;font-size:11px;color:var(--mute);letter-spacing:.04em;padding:0 3px;margin-top:-2px;font-variant-numeric:tabular-nums}
.tks span{width:0;display:flex;justify-content:center}
.rows{margin-top:14px}
.row+.row{margin-top:6px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;height:24px}
.rl{display:flex;align-items:center;gap:10px;white-space:nowrap}
.rl b{font-weight:700;font-size:14px}
.mk{font-size:12px;color:var(--mute);white-space:nowrap}
.mk em{font-style:normal;margin-right:3px}
.cn{font-family:Barlow,sans-serif;font-weight:500;font-size:13px;color:var(--mute);white-space:nowrap}
.sws{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));margin:0 -4px}
.sw{appearance:none;border:0;background:none;padding:0;margin:0;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sw i{display:block;width:min(34px,82%);aspect-ratio:1/1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);transition:transform .15s ease,box-shadow .2s ease}
.sw[aria-pressed="true"] i{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.sw:active i{transform:scale(.9)}
.sw:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:10px}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mute);padding:20px}
/* wide: the model on the left, the column on the right */
@media (min-width:700px) and (min-height:700px) and (max-aspect-ratio:11/10){.app{max-width:680px}.sw i{width:min(40px,80%)}}
@media (min-width:640px) and (min-aspect-ratio:11/10){
 .app{max-width:none;height:100svh;display:grid;grid-template-columns:minmax(0,1fr) clamp(290px,30vw,380px);grid-template-rows:auto auto 1fr auto auto;column-gap:clamp(20px,3vw,40px);padding:max(16px,min(24px,3vh)) max(20px,min(40px,3vw))}
 .hd,.info,.time,.rows{grid-column:2}
 .stage{grid-column:1;grid-row:1 / span 5;aspect-ratio:auto;height:100%;margin:0}
 .hd{grid-row:1}.info{grid-row:2}.time{grid-row:4;margin-top:0}.rows{grid-row:5}
}
@media (min-width:640px) and (min-aspect-ratio:11/10) and (max-height:520px){.info{display:none}.sw{height:42px}.rows{margin-top:6px}.time{margin-bottom:0}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="app">
 <header class="hd"><div class="logo" aria-label="234Lab.">234Lab<span class="dot" aria-hidden="true"></span></div><span class="tag">3D PROTOTYPE</span></header>
 <div class="info"><div class="ttl"><small>TITLE</small><b>Furniture Color Study</b></div><div class="ttl"><small>AREA</small><b>Faculty Area</b></div><div class="ttl"><small>USER</small><b>Fumiyo Suzaki</b></div></div>
 <div class="stage" id="stage">
  <canvas id="cv" aria-label="3D model of the room"></canvas>
  <button class="envb" id="pill" type="button" aria-label="Back to live time"><span class="lv"><i></i>LIVE</span><span class="tx" id="clock">--:--</span><span id="wxi"></span></button>
  <button class="rst" id="rst" type="button" aria-label="Reset view"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <div class="hint" id="hint"></div>
  <div class="err" id="err">3D表示に対応していないブラウザです</div>
 </div>
 <div class="time"><div class="trk"><input type="range" id="tm" min="0" max="1439" step="1" value="630" aria-label="Time of day"></div>
  <div class="tks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>
 <div class="rows">
  <div class="row"><div class="rh"><div class="rl"><b>Main Desk</b><span class="mk"><em>by</em>KANADEMONO</span></div><span class="cn" id="cnA"></span></div><div class="sws" id="swA"></div></div>
  <div class="row"><div class="rh"><div class="rl"><b>Sub Desk</b><span class="mk"><em>by</em>Park Side Market</span></div><span class="cn" id="cnB"></span></div><div class="sws" id="swB"></div></div>
 </div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ---------------- colours (the same lists as the app) ----------------
const COLS={a:[['Black','#353334'],['White','#e6e6e4'],['Light Gray','#d5d1cd'],['Dark Gray','#767680'],['Olive','#5e6460'],['Navy','#515467'],['Light Beige','#ddcbb4'],['Brown','#5f4f4f'],['Bordeaux','#744d49']],
 b:[['White','#dfdfda'],['Gray','#b1b5b8'],['Dark Gray','#8d9297'],['Black','#4b4b4c'],['Beige','#d4c2a9'],['Pebble','#cac2b9'],['Leather','#d4af8c'],['Walnut','#b19887'],['Olive','#929687']]};
const st={a:0,b:0};
try{const s=JSON.parse(localStorage.getItem('desk3d')||'{}');if(s.a>=0&&s.a<9)st.a=s.a;if(s.b>=0&&s.b<9)st.b=s.b;}catch(e){}

// ---------------- the room's numbers (mm, from src/sensei.js) ----------------
// u: along the wall without windows (0..2800), v: along the window wall (0..3000), z: up
const ROOM=[2800,3000],WALLH=2900,TOPZ=720,DESKA=[450,1850,0,800],DESKB=[1950,2650,400,1850];
const CU=1210,CV=1260,LAPU=1215,MUG0=[1640,690];
const WFACE=103,LAT=35.4437,LON=139.638,RAD=Math.PI/180;
const QP=new URLSearchParams(location.search);

// ---------------- renderer ----------------
const cv=document.getElementById('cv'),stage=document.getElementById('stage');
const MOB=matchMedia('(pointer:coarse)').matches;
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,powerPreference:'high-performance'});}
catch(e){document.getElementById('err').style.display='flex';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,MOB?1.75:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0xffffff,0);
const scene=new THREE.Scene();

// mm (u,v,z) -> three.js (x right-ish, y up, z)
const T=(p)=>new THREE.Vector3(p[0]/1000,p[2]/1000,p[1]/1000);
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const EDGE=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.13,depthWrite:false});
function addEdges(m,op){const l=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,25),op?new THREE.LineBasicMaterial({color:0,transparent:true,opacity:op,depthWrite:false}):EDGE);m.add(l);return m;}
function box(u0,u1,v0,v1,z0,z1,mat,par,o){o=o||{};const g=new THREE.BoxGeometry((u1-u0)/1000,(z1-z0)/1000,(v1-v0)/1000),m=new THREE.Mesh(g,mat);
 m.position.set((u0+u1)/2000,(z0+z1)/2000,(v0+v1)/2000);m.castShadow=o.cast!==false;m.receiveShadow=true;(par||scene).add(m);if(o.edge)addEdges(m,o.edge===true?0:o.edge);return m;}
// shadow-only blockers: walls and ceiling that are not drawn (they write nothing on screen but cast in the sun's shadow map)
const BLK=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false});
function blocker(u0,u1,v0,v1,z0,z1){const m=box(u0,u1,v0,v1,z0,z1,BLK);m.receiveShadow=false;return m;}

// ---------------- textures made here ----------------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function floorTex(){const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d'),R=rng(7);
 g.fillStyle='#a59d8c';g.fillRect(0,0,1024,1024);
 for(let i=0;i<260;i++){const x=R()*1024,y=R()*1024,rx=20+R()*70,ry=12+R()*40,a=R()*Math.PI;g.save();g.translate(x,y);g.rotate(a);
  g.fillStyle=R()<.55?'rgba(95,82,64,0.07)':'rgba(255,250,238,0.06)';g.beginPath();g.ellipse(0,0,rx,ry,0,0,Math.PI*2);g.fill();g.restore();}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
function blobTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
 gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.45,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}
function edgeTex(){const c=document.createElement('canvas');c.width=4;c.height=64;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,64);
 gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.35,'rgba(0,0,0,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,4,64);return new THREE.CanvasTexture(c);}
function glassTex(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
 g.fillStyle='rgba(255,255,255,0.10)';g.fillRect(0,0,256,256);
 [[30,40,.22],[96,26,.12],[150,10,.3]].forEach(([x,w,a])=>{g.fillStyle='rgba(255,255,255,'+a+')';g.beginPath();g.moveTo(x,256);g.lineTo(x+w,256);g.lineTo(x+w+120,0);g.lineTo(x+120,0);g.fill();});
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const BLOB=blobTex(),EDG=edgeTex();
// a soft dark patch on the floor (contact shade under things)
function blob(u,v,ru,rv,op){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:BLOB,transparent:true,opacity:op,depthWrite:false,color:0x2a2418}));
 m.rotation.x=-Math.PI/2;m.scale.set(ru*2/1000,rv*2/1000,1);m.position.set(u/1000,0.002,v/1000);m.renderOrder=1;scene.add(m);return m;}
// ---------------- the room ----------------
const M={wall:lam('#f6f5f2'),wallU:lam('#f3f2ef'),slab:lam('#d9d7d2'),beam:lam('#b3b0a9'),col:lam('#bdbab3'),sill:lam('#8a867f'),sillTop:lam('#bdb8af'),
 frame:lam('#c9cbcc'),sash:lam('#a9acae'),steel:lam('#b9bcbe'),leg:lam('#9fa3a6'),
 floor:new THREE.MeshLambertMaterial({map:floorTex()})};
// floor and its slab
box(-120,ROOM[0],-120,ROOM[1],-90,-1,M.slab,null,{cast:false,edge:true});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(ROOM[0]/1000,ROOM[1]/1000),M.floor);floor.rotation.x=-Math.PI/2;floor.position.set(ROOM[0]/2000,0,ROOM[1]/2000);floor.receiveShadow=true;scene.add(floor);
// the wall without windows (v = 0)
box(0,ROOM[0],-120,0,0,WALLH,M.wall,null,{edge:true});
// the window wall (u = 0): below the sill, the piers, the beam above, the post between the windows
box(-120,0,-120,ROOM[1],0,868,M.wallU,null,{edge:true});
box(-120,0,-120,398,868,2164,M.wallU,null,{edge:true});
box(-120,40,380,ROOM[1],2164,WALLH,M.beam,null,{edge:true});
box(-120,0,-120,380,2164,WALLH,M.wallU,null,{edge:true});
box(-120,30,2333,2414,850,2164,M.beam,null,{edge:true});
// the concrete column in the corner
box(0,380,0,380,0,WALLH,M.col,null,{edge:true});
// the stone sill under the windows
box(-60,95,372,ROOM[1],772,842,M.sill,null,{edge:true});
box(-60,110,372,ROOM[1],842,868,M.sillTop,null,{edge:true});
// window frames
function frameUnit(v0,v1,end){const z0=868,z1=2164;
 box(-80,-10,v0,v1,z0,917,M.frame,null,{edge:true});box(-80,-10,v0,v1,2114,z1,M.frame,null,{edge:true});
 box(-80,-10,v0,v0+49,z0,z1,M.frame,null,{edge:true});if(!end)box(-80,-10,v1-49,v1,z0,z1,M.frame,null,{edge:true});}
frameUnit(398,2333,false);frameUnit(2414,ROOM[1],true);
box(-80,-10,1279,1333,868,2164,M.frame,null,{edge:true});
const GL=[[471,1279],[1333,2309],[2487,ROOM[1]]];
GL.forEach(([a,b],i)=>{const e=b===ROOM[1];box(-70,-35,a,b,917,945,M.sash,null,{edge:.08});box(-70,-35,a,b,2086,2114,M.sash,null,{edge:.08});
 box(-70,-35,a,a+24,917,2114,M.sash,null,{edge:.08});if(!e)box(-70,-35,b-24,b,917,2114,M.sash,null,{edge:.08});});
// glass with a little sheen, and the sky behind it
const gtex=glassTex();
GL.forEach(([a,b])=>{const w=(b-a-24)/1000,h=(2086-945)/1000,t=gtex.clone();t.needsUpdate=true;t.repeat.set(w/1.0,1);t.wrapS=THREE.RepeatWrapping;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,color:0xffffff}));
 m.rotation.y=Math.PI/2;m.position.set(-0.05,(945+2086)/2000,(a+24+b)/2000);m.renderOrder=2;scene.add(m);});
const skyGeo=new THREE.PlaneGeometry(2.99,1.4,1,2);skyGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(skyGeo.attributes.position.count*3),3));
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true}));sky.rotation.y=Math.PI/2;sky.position.set(-0.13,1.5,1.495);scene.add(sky);
// what the sun cannot pass: the room's other two walls and its ceiling (not drawn)
blocker(ROOM[0],ROOM[0]+200,-200,ROOM[1]+200,0,WALLH+100);blocker(0,ROOM[0]+200,ROOM[1],ROOM[1]+200,0,WALLH+100);blocker(-125,ROOM[0]+200,-125,ROOM[1]+200,WALLH+6,WALLH+150);
// soft shade where the floor meets the walls and around the column (dark at the wall, fading out)
function strip(u0,v0,u1,v1,nu,nv,w,op){const L=Math.hypot(u1-u0,v1-v0)/1000,m=new THREE.Mesh(new THREE.PlaneGeometry(L,w/1000),new THREE.MeshBasicMaterial({map:EDG,transparent:true,opacity:op,depthWrite:false,color:0x2a2418}));
 let x=T([u1-u0,v1-v0,0]).normalize();const y=T([-nu,-nv,0]).normalize();let z=new THREE.Vector3().crossVectors(x,y);if(z.y<0){x.negate();z.negate();}
 m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));m.position.copy(T([(u0+u1)/2+nu*w/2,(v0+v1)/2+nv*w/2,1.5]));m.renderOrder=1;scene.add(m);}
strip(380,0,ROOM[0],0,0,1,320,.2);strip(0,380,0,ROOM[1],1,0,320,.2);strip(380,0,380,380,1,0,220,.16);strip(0,380,380,380,0,1,220,.16);

// ---------------- desks ----------------
const deskAMat=lam(COLS.a[st.a][1]),deskBMat=lam(COLS.b[st.b][1]);
const gA=new THREE.Group(),gB=new THREE.Group();scene.add(gA,gB);
box(DESKA[0],DESKA[1],DESKA[2],DESKA[3],TOPZ-25,TOPZ,deskAMat,gA,{edge:.18});
[DESKA[0]+280,DESKA[1]-280].forEach(ul=>{const vc=(DESKA[2]+DESKA[3])/2;
 box(ul-20,ul+20,vc-20,vc+20,30,TOPZ-52,M.steel,gA,{edge:.12});
 box(ul-22,ul+22,DESKA[2]+120,DESKA[3]-120,TOPZ-52,TOPZ-25,M.steel,gA,{edge:.12});
 box(ul-22,ul+22,DESKA[2]+110,DESKA[3]-110,0,30,M.steel,gA,{edge:.12});});
box(DESKA[0]+300,DESKA[1]-300,385,415,TOPZ-52,TOPZ-30,M.steel,gA,{edge:.12});
box(DESKB[0],DESKB[1],DESKB[2],DESKB[3],TOPZ-24,TOPZ,deskBMat,gB,{edge:.18});
[DESKB[2]+140,DESKB[3]-140].forEach(vl=>{[DESKB[0]+55,DESKB[1]-55].forEach(ut=>box(ut-13,ut+13,vl-13,vl+13,0,TOPZ-24,M.leg,gB,{edge:.12}));
 box(DESKB[0]+42,DESKB[1]-42,vl-12,vl+12,318,342,M.leg,gB,{edge:.12});});
blob((DESKA[0]+DESKA[1])/2,(DESKA[2]+DESKA[3])/2,820,520,.16);blob((DESKB[0]+DESKB[1])/2,(DESKB[2]+DESKB[3])/2,460,860,.16);
